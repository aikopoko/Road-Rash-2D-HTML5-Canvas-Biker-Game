<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Rash Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
    
        canvas {
            display: block;
            margin: 0 auto;
            background-color: #000;
        }
    
        #countdownOverlay {
            position: absolute;
            top: 0;
            left: 0;
            color: white;
            font-family: 'Arial Black', sans-serif;
            font-size: 100px;
            text-align: center;
            width: 100%;
            height: 100%;
            line-height: 600px;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        .container {
            position: relative; /* Important: This sets the reference for absolute positioning */
            width: 100%;
            height: 100vh; /* or any height you need */
        }

        .centered-image {
            position: absolute;
            top: -45%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .play-again {
            top: -19%;
            width: 184px;
            cursor: pointer;
        }

        .fade-out {
            animation: fadeOut 1s forwards;
        }
    
        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="countdownOverlay">3</div>
    <script src="game.js"></script>
    <div class="container" id="game-over" style="display: none;">
        <img src="assets/game-over.png" class="centered-image">
        <a href="/"><img src="assets/play-again.png" class="centered-image play-again"></a>
    </div>
</body>
</html>
